name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - run: python build_fastdec.py
      - run: pytest -q
      - name: tests also pass with the pure-Python decoder
        run: FOTOMEDIK_PURE=1 pytest -q

  ai-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ai]" pytest-github-actions-annotate-failures
      - run: python build_fastdec.py
      - uses: actions/cache@v4
        with:
          path: models
          key: ai-models-v1
      - name: real Real-ESRGAN and LaMa models
        env:
          FOTOMEDIK_AI_MODELS: "1"
          FOTOMEDIK_MODELS: models
        run: pytest -q -s tests/test_ai_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-check
          path: ai_check/

  dll-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: build _fastdec.dll (mingw gcc ships with the runner)
        run: python build_fastdec.py
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: fastdec-windows-x64
          path: fotomedik/jpeg/_fastdec.dll

  app-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyside6 pyinstaller onnxruntime-directml
      - name: build _fastdec.dll
        run: python build_fastdec.py
      - name: demo photos
        run: python scripts/make_demo_photos.py demo
      - name: app smoke test (from source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python fotomedik_app.py --smoke demo demo_out_src shot_src.png
      - name: stamp the build number
        shell: pwsh
        run: |
          "BUILD = ${{ github.run_number }}`nCOMMIT = `"${{ github.sha }}`"`n" | Set-Content -Encoding utf8 fotomedik/_build.py
          "{`"build`": ${{ github.run_number }}, `"commit`": `"${{ github.sha }}`"}" | Set-Content -Encoding utf8 version.json
      - name: package FotoMedik.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name FotoMedik
          --add-binary "fotomedik/jpeg/_fastdec.dll;fotomedik/jpeg"
          --hidden-import onnxruntime --collect-binaries onnxruntime
          --exclude-module tkinter --exclude-module pytest
          fotomedik_app.py
      - name: smoke test of the packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\FotoMedik.exe -ArgumentList "--smoke","demo","demo_out_exe","shot_exe.png" -PassThru -Wait
          Write-Host "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (!(Test-Path demo_out_exe\healthy.jpg)) { exit 1 }
      - uses: actions/cache@v4
        with:
          path: models
          key: ai-models-v1
      - name: AI smoke test of the packaged app (real models)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FOTOMEDIK_MODELS: ${{ github.workspace }}\models
        run: |
          $p = Start-Process -FilePath dist\FotoMedik.exe -ArgumentList "--smoke-ai","demo","demo_out_ai","shot_ai.png" -PassThru -Wait
          if (Test-Path shot_ai.txt) { Get-Content shot_ai.txt }
          Write-Host "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (!(Get-ChildItem demo_out_ai -Filter *_ai.jpg)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FotoMedik-windows
          path: dist/FotoMedik.exe
      - name: publish as the "app" release (stable download link)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create app dist/FotoMedik.exe version.json --title "FotoMedik app (latest build)" --notes "Build ${{ github.run_number }}"
          } else {
            gh release upload app dist/FotoMedik.exe version.json --clobber
            gh release edit app --notes "Build ${{ github.run_number }} from commit ${{ github.sha }}. Download FotoMedik.exe and run it; it updates itself afterwards."
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: |
            shot_*.png
            shot_*.txt
            demo_out_ai/*_ai.jpg
