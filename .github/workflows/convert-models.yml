name: convert-models

# Exports super-resolution networks to ONNX and puts them on the "models-sr" release,
# for trying them as the thumbnail step's enlarger. Started by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install onnx onnxruntime timm numpy
      - name: Download weights
        run: |
          mkdir -p w
          cd w
          for u in \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.1/RealESRNet_x4plus.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth \
            https://github.com/JingyunLiang/SwinIR/releases/download/v0.0/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth \
            https://github.com/JingyunLiang/SwinIR/releases/download/v0.0/003_realSR_BSRGAN_DFOWMFC_s64w8_SwinIR-L_x4_PSNR.pth
          do curl -sSL -O "$u"; done
          ls -la
      - name: SwinIR architecture
        run: git clone --depth 1 https://github.com/JingyunLiang/SwinIR.git swinir
      - name: Export
        run: python scripts/export_sr.py w onnx swinir
      - name: Check
        run: |
          python - <<'EOF'
          import numpy as np, onnxruntime as ort, glob
          for f in sorted(glob.glob("onnx/*.onnx")):
              s = ort.InferenceSession(f, providers=["CPUExecutionProvider"])
              y = s.run(None, {"input": np.random.rand(1, 3, 37, 45).astype(np.float32)})[0]
              print(f, y.shape, float(y.min()), float(y.max()))
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models-sr >/dev/null 2>&1 || gh release create models-sr --title "Super-resolution models (ONNX)" --notes "Exported by the convert-models workflow from the authors' published weights (Real-ESRGAN: BSD-3-Clause; SwinIR: Apache-2.0)."
          gh release upload models-sr onnx/*.onnx --clobber
