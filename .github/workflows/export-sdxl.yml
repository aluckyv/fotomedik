name: export-sdxl

# Exports the SDXL inpainting model (diffusers/stable-diffusion-xl-1.0-inpainting-0.1,
# CreativeML Open RAIL++-M) to ONNX in fp16 for FotoMedik's diffusion step, and puts it on
# the "models-sdxl" release, the large files cut into parts under GitHub's 2 GB limit.
# Started by hand; a CPU runner with swap does the export.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Room on disk and in memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 28G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -g; df -h / /mnt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          # torch and torchvision from the same CPU index, pinned together: a torchvision from PyPI
          # (pulled in by optimum[exporters]) fails with "operator torchvision::nms does not exist".
          # numpy 1.x: ONNX Runtime 1.20's UNet attention fusion fails on numpy 2 (int() of a 1-d array)
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy==1.26.4" "torch==2.5.1" "torchvision==0.20.1" "diffusers==0.31.0" "transformers==4.46.3" "optimum[exporters]==1.23.3" "onnx==1.17.0" "onnxruntime==1.20.1" onnxconverter-common accelerate safetensors
      - name: Export (fp32)
        run: |
          set -o pipefail
          cd /mnt && sudo chown -R "$USER" /mnt
          optimum-cli export onnx --model diffusers/stable-diffusion-xl-1.0-inpainting-0.1 \
            --task inpainting --no-post-process /mnt/sdxl32 2>&1 | tail -40
          du -sh /mnt/sdxl32/*
      - name: fp16
        run: |
          # ONNX Runtime's own Stable Diffusion optimizer: fuses attention and converts to fp16 with
          # the types kept consistent (a plain onnxconverter-common pass left Add nodes with mixed
          # float/float16 inputs). SDXL's VAE decoder stays fp32 (fp16 gives NaN, black pictures).
          # Fusions that only exist on CUDA are left out so the models also load on the CPU.
          set -o pipefail
          python -m onnxruntime.transformers.models.stable_diffusion.optimize_pipeline \
            -i /mnt/sdxl32 -o /mnt/sdxl16 --float16 --use_external_data_format \
            --disable_group_norm --disable_skip_group_norm --disable_nhwc_conv \
            --disable_bias_splitgelu --disable_bias_add --disable_packed_kv --disable_packed_qkv 2>&1 | tail -40
          rm -rf /mnt/sdxl32
          du -sh /mnt/sdxl16/*
      - name: Check
        run: |
          python - <<'EOF'
          import onnxruntime as ort, glob
          for f in sorted(glob.glob("/mnt/sdxl16/*/model.onnx")):
              s = ort.InferenceSession(f, providers=["CPUExecutionProvider"])
              print(f, [(i.name, i.shape, i.type) for i in s.get_inputs()])
          EOF
      - name: Cut into parts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /mnt/sdxl16
          mkdir -p /mnt/up
          for part in *; do
            [ -d "$part" ] || continue
            tar -cf "/mnt/up/sdxl-inpaint-$part.tar" -C "$part" .
          done
          cd /mnt/up
          for f in *.tar; do split -b 1900M -d -a 2 "$f" "$f.part"; rm "$f"; done
          sha256sum * > SHA256SUMS
          ls -la
          gh release view models-sdxl >/dev/null 2>&1 || gh release create models-sdxl --title "SDXL inpainting (ONNX fp16)" \
            --notes "diffusers/stable-diffusion-xl-1.0-inpainting-0.1 exported to ONNX fp16 by the export-sdxl workflow. Licence: CreativeML Open RAIL++-M (its use restrictions apply and pass on). Parts: cat sdxl-inpaint-<part>.tar.part* > <part>.tar"
          gh release upload models-sdxl * --clobber
