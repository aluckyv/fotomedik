[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fotomedik"
version = "0.1.0"
description = "Diagnose and repair corrupted photos (JPEG first): honest diagnosis, recipe-based repair, recovery report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vladimir Lakić" }]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["onnxruntime>=1.17"]  # on Windows: onnxruntime-directml (graphics card)

[project.scripts]
fotomedik = "fotomedik.cli:main"

[tool.setuptools.packages.find]
include = ["fotomedik*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
